{%- assign p = include.project -%}
{%- assign sec = include.section -%}
<article class="tile plate hue-{{ sec.hue }}{% if p.wide %} is-wide{% endif %}{% if p.soon %} is-soon{% endif %}" id="p-{{ p.id }}" data-project="{{ p.id }}" data-type="{{ p.type }}"
         data-added="{{ p.added | date: '%Y-%m-%d' }}" data-updated="{{ p.updated | date: '%Y-%m-%d' }}"
         style="view-transition-name: p-{{ p.id }}">
  {%- if p.legacy_anchor %}<span class="legacy-anchor" id="{{ p.legacy_anchor }}"></span>{% endif %}
  <div class="plate-art">
    {%- include glyph.html id=p.glyph class="plate-glyph" %}
  </div>

  <div class="plate-body">
    <h3 class="plate-title">
      {%- if p.soon %}{{ p.title }}{% else %}<a class="plate-link" href="{{ p.url }}" data-track="{{ p.id }}">{{ p.title }}</a>{% endif %}
      <span class="badges" data-badges></span>
    </h3>
    <p class="plate-summary">{{ p.summary }}</p>
  </div>

  {%- if p.soon %}
  <footer class="plate-foot"><span class="plate-soon">Coming soon</span></footer>
  {%- endif %}
</article>
