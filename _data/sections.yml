# Tool types, in display order. Each project's `type` places it here.
#   title   plural heading and filter label
#   one     singular label shown on each plate
#   hue     color family in assets/site.css — the page borrows the portal triad:
#           blue = portal vein, red = hepatic artery, green = bile duct, amber = bilirubin
#   verb    default call to action (a project can override it with `cta`)
#   vessel  the part of the lobule that carries this color; the hero legend filters by it

- id: calculators
  type: calculator
  vessel: Bilirubin
  title: Calculators
  one: Calculator
  hue: amber
  verb: Open calculator
  blurb: Risk and pressure estimates from published models.

- id: education
  type: case
  vessel: Hepatic artery
  title: Cases
  one: Interactive case
  hue: crimson
  verb: Start case
  blurb: Reason through real patterns before the reveal.

- id: simulators
  type: simulator
  vessel: Portal vein
  title: Simulators
  one: Simulator
  hue: blue
  verb: Run simulator
  blurb: Move a variable and watch the physiology answer.

- id: research
  type: research
  vessel: Bile duct
  title: Research
  one: Research tool
  hue: green
  verb: Open workspace
  blurb: Writing and signal tools that run in your browser.
