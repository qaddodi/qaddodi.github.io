# One entry per project. This file drives the homepage rows, the figure strip,
# the search palette, JSON-LD, /projects.json, and the 404 page.
#
# Fields
#   id        unique slug, also the row anchor (#p-<id>)
#   legacy_anchor  optional old anchor kept working for existing links
#   title     display name
#   short     2–3 word label under the figure-strip glyph
#   url       where the project lives
#   repo      owner/name on GitHub; the homepage reads the latest commit date from it
#   path      optional folder inside `repo` (for projects that live in a subfolder)
#   type      calculator | case | simulator | research  (see _data/sections.yml)
#   glyph     file in _includes/glyphs/ (without .svg)
#   summary   one or two sentences
#   specimen  label/value pairs shown as the row's "figure caption"
#   sources   optional citations; `url` optional
#   note      optional short caveat shown in the meta line
#   keywords  extra words for search
#   added     date it first appeared on the homepage (drives the "New" badge)
#   updated   last meaningful update (the homepage refreshes this from GitHub when it can)
#   cta       optional override of the section's call to action

- id: chb-hcc-risk
  legacy_anchor: t-hcc
  title: CHB HCC Risk Calculators
  short: HCC risk
  url: https://qaddodi.github.io/chb-hcc-risk/
  repo: qaddodi/chb-hcc-risk
  type: calculator
  glyph: hcc
  summary: >-
    Hepatocellular carcinoma risk in chronic hepatitis B from two validated scores,
    calculated side by side from one shared form.
  specimen:
    - [In, "Age · sex · platelets · albumin · AST · quantitative HBsAg"]
    - [Out, "HBsAg-HCC and PAGE-B risk, with EMR-ready text to copy"]
  sources:
    - text: Papatheodoridis et al., J Hepatol 2016 (PAGE-B)
      url: https://pubmed.ncbi.nlm.nih.gov/26678008/
    - text: Guo et al., Aliment Pharmacol Ther 2026 (HBsAg-HCC)
      url: https://pubmed.ncbi.nlm.nih.gov/41933428/
  keywords: hepatitis B HBV CHB hepatocellular carcinoma surveillance PAGE-B HBsAg
  added: 2026-07-23
  updated: 2026-07-22

- id: portal-hypertension-predictor
  legacy_anchor: t-portal-htn
  title: Portal Hypertension Predictor
  short: Portal HTN
  url: https://qaddodi.github.io/portal-hypertension-predictor/
  repo: qaddodi/portal-hypertension-predictor
  type: calculator
  glyph: portal-htn
  summary: >-
    Probability of clinically significant and severe portal hypertension from routine
    labs, using the Vienna models, with liver stiffness if you have it.
  specimen:
    - [In, "Platelets · bilirubin · INR  (+ liver stiffness, optional)"]
    - [Out, "P(CSPH, HVPG ≥ 10) and P(severe PH, HVPG ≥ 16)"]
  sources:
    - text: Reiniš et al., J Hepatol 2023;78:390–400
    - text: Mohammed et al., Dig Dis Sci 2026 (US validation)
  note: A rule-out aid. Confirm with HVPG where management depends on it.
  keywords: CSPH HVPG Vienna cirrhosis compensated elastography LSM FIB-4
  added: 2026-07-13
  updated: 2026-07-09

- id: liver-injury-backtracker
  legacy_anchor: t-backtrack
  title: Liver Injury Backtracker
  short: Backtracker
  url: https://qaddodi.github.io/liverenzymebacktrack/
  repo: qaddodi/liverenzymebacktrack
  type: calculator
  glyph: backtrack
  summary: >-
    Work backward from today's AST, ALT, and LDH to estimate what they were hours
    or days ago, using editable enzyme half-lives.
  specimen:
    - [In, "Current AST · ALT · LDH and the time they were drawn"]
    - [Out, "A table of estimated earlier values, in 12-hour steps by default"]
  note: "Default half-lives: AST 17 h, ALT 72 h, LDH 24 h."
  keywords: transaminase half-life timing injury onset ischemic enzymes
  added: 2026-07-13
  updated: 2024-12-28

