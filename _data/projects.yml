- id: portal-hypertension-predictor
  legacy_anchor: t-portal-htn
  title: Portal Hypertension Predictor
  short: Portal HTN
  url: https://qaddodi.github.io/portal-hypertension-predictor/
  repo: qaddodi/portal-hypertension-predictor
  type: calculator
  glyph: portal-htn
  art: portal-htn
  summary: >-
    Chance of clinically significant portal hypertension in cirrhosis, from routine labs and, if you have it, liver stiffness.
  specimen:
    - [In, "Platelets · bilirubin · INR · liver stiffness (optional)"]
    - [Out, "P(CSPH, HVPG ≥ 10) and P(severe PH, HVPG ≥ 16)"]
  sources:
    - text: Reiniš et al., J Hepatol 2023;78:390–400
    - text: Mohammed et al., Dig Dis Sci 2026 (US validation)
  note: A rule-out aid. Confirm with HVPG where management depends on it.
  keywords: CSPH HVPG Vienna cirrhosis compensated elastography LSM FIB-4
  try: vienna
  added: 2026-07-13
  updated: 2026-07-09

