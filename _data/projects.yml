# One entry per project. This file drives the homepage rows, the figure strip,
# the search palette, JSON-LD, /projects.json, and the 404 page.
#
# Fields
#   id        unique slug, also the row anchor (#p-<id>)
#   legacy_anchor  optional old anchor kept working for existing links
#   title     display name
#   short     2–3 word label under the figure-strip glyph
#   url       where the project lives
#   repo      owner/name on GitHub; the homepage reads the latest commit date from it
#   path      optional folder inside `repo` (for projects that live in a subfolder)
#   type      calculator | case | simulator | research  (see _data/sections.yml)
#   glyph     small icon: file in _includes/glyphs/ (without .svg)
#   art       plate illustration: file in _includes/art/ (made by _scripts/make-art.py);
#             optional, the glyph is drawn large when it's missing
#   summary   one plain-English sentence, shown on the card (write it for a medical student)
#   specimen  label/value pairs; used for search, not shown on the homepage
#   sources   optional citations; `url` optional
#   note      optional short caveat shown in the meta line
#   keywords  extra words for search
#   added     date it first appeared on the homepage (drives the "New" badge)
#   updated   last meaningful update (the homepage refreshes this from GitHub when it can)
#   cta       optional override of the section's call to action
#   wide      optional; true makes the plate a double-width flagship (keep the grid even:
#             see README)
#   try       optional inline demo on the plate, drawn by site.js: vienna | backtrack | pressure
#   soon      optional; true shows the plate as "Coming soon" with no link, and leaves the
#             project out of paths, search results, the 404 page, JSON-LD, and /projects.json

- id: chb-hcc-risk
  legacy_anchor: t-hcc
  title: CHB HCC Risk Calculators
  short: HCC risk
  url: https://qaddodi.github.io/chb-hcc-risk/
  repo: qaddodi/chb-hcc-risk
  type: calculator
  glyph: hcc
  art: hcc
  summary: >-
    Liver cancer risk in chronic hepatitis B, from two published scores: PAGE-B and HBsAg-HCC.
  specimen:
    - [In, "Age · sex · platelets · albumin · AST · quantitative HBsAg"]
    - [Out, "HBsAg-HCC and PAGE-B risk, with EMR-ready text to copy"]
  sources:
    - text: Papatheodoridis et al., J Hepatol 2016 (PAGE-B)
      url: https://pubmed.ncbi.nlm.nih.gov/26678008/
    - text: Guo et al., Aliment Pharmacol Ther 2026 (HBsAg-HCC)
      url: https://pubmed.ncbi.nlm.nih.gov/41933428/
  keywords: hepatitis B HBV CHB hepatocellular carcinoma surveillance PAGE-B HBsAg
  added: 2026-07-23
  updated: 2026-07-22

