# The homepage groups tools by what a visitor wants to do. `types` are tool types from
# sections.yml, shown in this order inside the group.

- id: learn
  title: Teaching
  blurb: Cases and simulators for students, residents and fellows.
  types: [case, simulator]

- id: bedside
  title: In clinic
  blurb: Calculators and one clinic protocol, each built on a published source.
  types: [calculator]

- id: research
  title: Research
  blurb: An abstract writer and an EEG viewer. Both run in your browser.
  types: [research]
