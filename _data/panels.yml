# The daily "Today's panel" puzzle on the homepage.
# Cases, lab values, and teaching points come from Interpreting the Liver Panel
# (qaddodi/acute-liver-injury-cases). One case is shown per day, in a fixed rotation.
# Each lab is [name, value, unit, tell]; tell = true marks the clues highlighted after the reveal.
# Add a case by appending an entry; answers become the multiple-choice options.
# zone (optional) lights up the lobule after the reveal: "1", "2", or "3" for a textbook
# zonal pattern, "extrahepatic" when the source isn't the liver. Leave it out otherwise
# (the whole lobule is highlighted). Reference ranges for the H/L flags are in labs.yml.

- case: 1
  answer: "Ischemic hepatitis"
  zone: "3"
  clue: "Marked hepatocellular injury in the thousands. What pattern gives away the diagnosis?"
  teach: "ALT:LDH < 1.5 supports ischemic hepatitis. When AST and ALT are in the thousands, think acute viral, autoimmune, acetaminophen, or ischemic injury."
  labs:
    - ["AST", "7,000", "U/L", true]
    - ["ALT", "9,000", "U/L", true]
    - ["ALP", "120", "U/L", false]
    - ["GGT", "70", "U/L", false]
    - ["LDH", "7,000", "U/L", true]
    - ["T bili", "2.0", "mg/dL", false]
    - ["Albumin", "3.0", "g/dL", false]
    - ["T prot", "5.2", "g/dL", false]
    - ["INR", "1.2", "", false]
    - ["Plt", "550,000", "/µL", false]
    - ["MCV", "92", "fL", false]

- case: 2
  answer: "Alcohol-associated hepatitis"
  clue: "The transaminases are not in the thousands, but the patient is sick. What is the pattern?"
  teach: "AST:ALT > 2 with AST in the 100s, not the 1000s. Bilirubin and INR define severity. AST in the 1000s is not alcohol-associated hepatitis; look for another cause."
  labs:
    - ["AST", "300", "U/L", true]
    - ["ALT", "130", "U/L", true]
    - ["ALP", "120", "U/L", false]
    - ["GGT", "500", "U/L", true]
    - ["LDH", "150", "U/L", false]
    - ["T bili", "5.0", "mg/dL", true]
    - ["Albumin", "4.0", "g/dL", false]
    - ["T prot", "6.1", "g/dL", false]
    - ["INR", "2.5", "", true]
    - ["Plt", "50,000", "/µL", true]
    - ["MCV", "102", "fL", true]

- case: 3
  answer: "Acetaminophen toxicity"
  zone: "3"
  clue: "ALT is over 10,000 and the INR is high."
  teach: "ALT > 10,000 should trigger acetaminophen toxicity. Do not delay NAC while the level is pending, and use the King's College Criteria to trigger transplant evaluation."
  labs:
    - ["AST", "9,000", "U/L", true]
    - ["ALT", "12,000", "U/L", true]
    - ["ALP", "130", "U/L", false]
    - ["GGT", "55", "U/L", false]
    - ["LDH", "5,000", "U/L", true]
    - ["T bili", "5.0", "mg/dL", true]
    - ["Albumin", "2.7", "g/dL", true]
    - ["T prot", "4.9", "g/dL", true]
    - ["INR", "3.5", "", true]
    - ["Plt", "210,000", "/µL", false]
    - ["MCV", "85", "fL", false]
    - ["Lipase", "1,000", "U/L", true]

- case: 4
  answer: "Rhabdomyolysis"
  zone: "extrahepatic"
  clue: "AST is enormous, ALT is far lower, and LDH is high. Is this liver injury?"
  teach: "AST far out of proportion to ALT points away from the liver: muscle, heart, red cells, or kidney. Confirm a muscle source with CK."
  labs:
    - ["AST", "10,000", "U/L", true]
    - ["ALT", "850", "U/L", true]
    - ["ALP", "80", "U/L", false]
    - ["GGT", "35", "U/L", false]
    - ["LDH", "5,000", "U/L", true]
    - ["T bili", "1.0", "mg/dL", false]
    - ["Albumin", "4.0", "g/dL", false]
    - ["T prot", "6.2", "g/dL", false]
    - ["INR", "1.0", "", false]
    - ["Plt", "190,000", "/µL", false]
    - ["MCV", "80", "fL", false]

- case: 5
  answer: "Acute liver injury in chronic alcohol use"
  clue: "The patient drinks chronically and AST:ALT is above 2, but the enzymes are in the thousands. Does the alcohol pattern explain everything?"
  teach: "AST:ALT > 2 fits alcohol, but values in the thousands are not alcohol-associated hepatitis. The alcohol pattern does not close the workup; look for a second injury."
  labs:
    - ["AST", "6,000", "U/L", true]
    - ["ALT", "2,500", "U/L", true]
    - ["ALP", "400", "U/L", false]
    - ["GGT", "550", "U/L", true]
    - ["LDH", "700", "U/L", false]
    - ["T bili", "1.2", "mg/dL", false]
    - ["Albumin", "3.1", "g/dL", true]
    - ["T prot", "5.6", "g/dL", false]
    - ["INR", "1.2", "", false]
    - ["Plt", "50,000", "/µL", true]
    - ["MCV", "102", "fL", true]

- case: 6
  answer: "Cholestatic injury"
  clue: "ALP and GGT dominate. What pattern is this, and why can the INR rise?"
  teach: "R factor < 2: mainly ALP and GGT. Next, a right upper quadrant ultrasound. A rising INR can come from vitamin K deficiency; give vitamin K IV, not PO."
  labs:
    - ["AST", "50", "U/L", false]
    - ["ALT", "60", "U/L", false]
    - ["ALP", "500", "U/L", true]
    - ["GGT", "700", "U/L", true]
    - ["LDH", "180", "U/L", false]
    - ["T bili", "4.5", "mg/dL", true]
    - ["Albumin", "4.0", "g/dL", false]
    - ["T prot", "6.2", "g/dL", false]
    - ["INR", "1.5", "", true]
    - ["Plt", "190,000", "/µL", false]
    - ["MCV", "80", "fL", false]

- case: 7
  answer: "Extrahepatic ALP"
  zone: "extrahepatic"
  clue: "ALP is high, but GGT is not. Where is the source?"
  teach: "A high ALP with a normal GGT means the source is not hepatic: bone, intestine, kidney, or placenta."
  labs:
    - ["AST", "20", "U/L", false]
    - ["ALT", "30", "U/L", false]
    - ["ALP", "500", "U/L", true]
    - ["GGT", "35", "U/L", true]
    - ["LDH", "180", "U/L", false]
    - ["T bili", "0.5", "mg/dL", false]
    - ["Albumin", "4.0", "g/dL", false]
    - ["T prot", "6.2", "g/dL", false]
    - ["INR", "1.0", "", false]
    - ["Plt", "190,000", "/µL", false]
    - ["MCV", "80", "fL", false]

- case: 8
  answer: "Alcohol drinking pattern"
  clue: "The liver enzymes barely move, but several alcohol markers cluster together. What do they tell you?"
  teach: "GGT rises with alcohol even without major liver injury. Other drinking hallmarks: high MCV, low platelets, AST:ALT > 2, high IgA."
  labs:
    - ["AST", "30", "U/L", false]
    - ["ALT", "15", "U/L", false]
    - ["ALP", "80", "U/L", false]
    - ["GGT", "800", "U/L", true]
    - ["LDH", "180", "U/L", false]
    - ["T bili", "0.5", "mg/dL", false]
    - ["Albumin", "4.0", "g/dL", false]
    - ["T prot", "6.2", "g/dL", false]
    - ["INR", "1.0", "", false]
    - ["Plt", "100,000", "/µL", true]
    - ["MCV", "102", "fL", true]

- case: 9
  answer: "Infiltrative liver injury"
  clue: "ALP and GGT are high, but bilirubin is normal. What bucket does this suggest?"
  teach: "ALP and GGT up with a normal bilirubin suggests infiltration: sarcoidosis, syphilis, drug-induced injury, early PBC, or infiltrating carcinoma."
  labs:
    - ["AST", "50", "U/L", false]
    - ["ALT", "60", "U/L", false]
    - ["ALP", "1,000", "U/L", true]
    - ["GGT", "700", "U/L", true]
    - ["LDH", "180", "U/L", false]
    - ["T bili", "0.5", "mg/dL", true]
    - ["Albumin", "4.0", "g/dL", false]
    - ["T prot", "6.2", "g/dL", false]
    - ["INR", "1.0", "", false]
    - ["Plt", "190,000", "/µL", false]
    - ["MCV", "80", "fL", false]

- case: 10
  answer: "Cirrhosis"
  clue: "The enzymes are not dramatic. Which chronic pattern matters most?"
  teach: "AST > ALT can be a cirrhosis clue even when values look near normal. Low platelets are especially useful; they often reflect portal hypertension."
  labs:
    - ["AST", "30", "U/L", true]
    - ["ALT", "12", "U/L", true]
    - ["ALP", "80", "U/L", false]
    - ["GGT", "35", "U/L", false]
    - ["LDH", "180", "U/L", false]
    - ["T bili", "1.5", "mg/dL", true]
    - ["Albumin", "3.3", "g/dL", true]
    - ["T prot", "4.8", "g/dL", true]
    - ["INR", "1.3", "", true]
    - ["Plt", "140,000", "/µL", true]
    - ["MCV", "90", "fL", false]

- case: 11
  answer: "Chronic liver disease"
  clue: "Mild ALT-predominant injury. What workup bucket opens?"
  teach: "Mild ALT-predominant elevation opens the chronic workup: hepatitis B and C, hemochromatosis, autoimmune hepatitis, A1AT deficiency, Wilson disease, MASLD. MASLD remains a diagnosis of exclusion."
  labs:
    - ["AST", "30", "U/L", false]
    - ["ALT", "60", "U/L", true]
    - ["ALP", "100", "U/L", false]
    - ["GGT", "35", "U/L", false]
    - ["LDH", "180", "U/L", false]
    - ["T bili", "1.0", "mg/dL", false]
    - ["Albumin", "4.0", "g/dL", false]
    - ["T prot", "6.0", "g/dL", false]
    - ["INR", "1.0", "", false]
    - ["Plt", "250,000", "/µL", false]
    - ["MCV", "80", "fL", false]

- case: 12
  answer: "Hemolysis with possible DIC"
  zone: "extrahepatic"
  clue: "AST is high without ALT elevation, and bilirubin/LDH/MCV are high. What process fits?"
  teach: "High AST with a normal ALT points to an extrahepatic source. High LDH, bilirubin, and MCV support hemolysis; a high INR with low platelets raises concern for DIC."
  labs:
    - ["AST", "400", "U/L", true]
    - ["ALT", "30", "U/L", true]
    - ["ALP", "90", "U/L", false]
    - ["GGT", "35", "U/L", false]
    - ["LDH", "1,000", "U/L", true]
    - ["T bili", "6.0", "mg/dL", true]
    - ["Albumin", "4.0", "g/dL", false]
    - ["T prot", "6.0", "g/dL", false]
    - ["INR", "3.0", "", true]
    - ["Plt", "50,000", "/µL", true]
    - ["MCV", "110", "fL", true]

- case: 13
  answer: "Acute Wilson disease"
  clue: "Very high bilirubin, very low ALP, hemolysis markers, and liver failure. What is the diagnosis?"
  teach: "AST:ALT > 2.2 and ALP:bilirubin < 4, with Coombs-negative hemolysis and a high INR. This is a transplant emergency."
  labs:
    - ["AST", "800", "U/L", true]
    - ["ALT", "300", "U/L", true]
    - ["ALP", "15", "U/L", true]
    - ["GGT", "200", "U/L", false]
    - ["LDH", "500", "U/L", true]
    - ["T bili", "40.0", "mg/dL", true]
    - ["Albumin", "2.1", "g/dL", true]
    - ["T prot", "4.8", "g/dL", true]
    - ["INR", "3.5", "", true]
    - ["Plt", "100,000", "/µL", true]
    - ["MCV", "110", "fL", true]
